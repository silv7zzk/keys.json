name: Gerar keys

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: Tipo da key
        required: true
        type: choice
        options:
          - diaria
          - semanal
          - mensal
          - permanente
      quantidade:
        description: Quantidade de keys
        required: true
        default: '1'
        type: string

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar keys
        env:
          TIPO: ${{ inputs.tipo }}
          QUANTIDADE: ${{ inputs.quantidade }}
        run: node scripts/gerar-keys.js

      - name: Salvar keys no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keys.json
          git diff --cached --quiet || git commit -m "chore: gerar keys"
          git push
          
